version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1,<4.0",
  "gunicorn~=23.0.0",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "redis>=5,<7"
]

[project.scripts]
app = "main:app"

[dependency-groups]
dev = ["pytest>=8,<10", "fakeredis[lua]>=2.26,<3"]
